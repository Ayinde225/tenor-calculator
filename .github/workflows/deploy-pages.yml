name: Deploy to GitHub Pages

# Builds the calculator UI and publishes it to GitHub Pages on every push to
# master. The app uses a relative base (vite.config.ts `base: './'`), so it works
# unchanged under the project subpath GitHub Pages serves it from.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer push supersede an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The UI's typecheck resolves @tenor/calculator-core to its built types, so
      # the engine must be compiled before the UI is built.
      - name: Build the engine
        run: npm run build --workspace @tenor/calculator-core

      - name: Build the calculator UI
        run: npm run build --workspace @tenor/calculator-ui

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/calculator-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
